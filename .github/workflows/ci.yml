name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: wasp
          POSTGRES_PASSWORD: wasp
          POSTGRES_DB: wasp
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL_TEST || 'postgresql://wasp:wasp@127.0.0.1:5432/wasp' }}
      BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET_TEST || 'dummy-secret-of-at-least-32-characters' }}
      BETTER_AUTH_URL: ${{ secrets.BETTER_AUTH_URL_TEST || 'http://127.0.0.1:3100' }}
      GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID_TEST || 'dummy-client' }}
      GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET_TEST || 'dummy-secret' }}
      KV_REST_API_URL: ${{ secrets.KV_REST_API_URL_TEST || '' }}
      KV_REST_API_TOKEN: ${{ secrets.KV_REST_API_TOKEN_TEST || '' }}

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:migrate
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm audit --audit-level high
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
        env:
          CI: true
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
