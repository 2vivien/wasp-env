title = "Wasp secret scanning"

[extend]
useDefault = true

[allowlist]
paths = [
  '''\.env\.example$''',
  '''pnpm-lock\.yaml$''',
  '''docs/.*''',
  '''\.gitleaks\.toml$''',
]

# Valeurs factices explicites utilisées par la CI et les tests : aucun secret réel.
[allowlist.regexes]
regexes = [
  '''dummy-secret-of-at-least-32-characters''',
  '''0123456789abcdef''',
]
